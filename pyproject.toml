[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rvc-tool"
version = "0.1.0"
description = "Renesas Verification Companion - unify VIL, master report, patterns and list files into one dashboard + AI-review Excel."
readme = "README.md"
requires-python = ">=3.7"
dependencies = ["openpyxl>=3.0"]

[project.scripts]
rvc = "rvc_tool.cli:main"

[tool.setuptools]
packages = ["rvc_tool"]
